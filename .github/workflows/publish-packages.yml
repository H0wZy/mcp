name: 📦 Publish Packages to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing & Provenance

jobs:
  publish-packages:
    name: 🚀 Publish Packages to npmjs.com
    runs-on: ubuntu-24.04
    environment: .env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @h0wzy/mcp-shared
        run: npm publish ./shared --access public --provenance
        continue-on-error: true

      - name: Publish @h0wzy/mcp-server-antigravity
        run: npm publish ./servers/antigravity --access public --provenance
        continue-on-error: true

      - name: Publish @h0wzy/mcp-server-codex
        run: npm publish ./servers/codex --access public --provenance
        continue-on-error: true

      - name: Publish @h0wzy/mcp
        run: npm publish ./npm --access public --provenance
        continue-on-error: true
